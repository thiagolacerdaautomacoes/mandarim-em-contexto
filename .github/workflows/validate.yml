name: Validate extension

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check 'src/**/*.{ts,tsx,css}' 'test/unit/**/*.ts' STUDY_SYSTEM_PLAN.md
      - run: pnpm exec eslint src
      - run: pnpm exec tsc --noEmit --project tsconfig.app.json
      - run: pnpm exec vitest run
      - run: pnpm exec plasmo build --target=chrome-mv3
